name: Crear APK de Ferli Finanzas
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias
        run: npm install
      - name: Crear proyecto Android
        run: npx cap add android
      - name: Restaurar firma fija
        env:
          SIGNING_KEY: ${{ secrets.FERLI_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo 'Falta configurar FERLI_DEBUG_KEYSTORE_BASE64. No se generará una firma temporal.'
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /dev/null
      - name: Incrementar versión
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          version = 1000 + int(os.environ['BUILD_NUMBER'])
          s, count = re.subn(r'versionCode\s+\d+', f'versionCode {version}', s)
          if count != 1:
              raise SystemExit('No se encontró versionCode único')
          p.write_text(s)
          PY
      - name: Compilar APK instalable
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Ferli-Finanzas-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
